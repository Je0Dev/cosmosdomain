cosmosdomain:
  api-key: ${TMDB_API_KEY:d9d6a0b80584c6c12fdcc041bc430ee5}
  base-url: https://api.themoviedb.org/3
  image-base-url: https://image.tmdb.org/t/p
  poster-size: w500
  backdrop-size: w1280
  media-dir: ./media

spring:
  application:
    name: cosmosdomain
  profiles:
    active: dev
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false
  datasource:
    url: jdbc:h2:file:./data/cosmosdomain;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  thymeleaf:
    cache: true
    mode: HTML
    encoding: UTF-8
    suffix: .html
    prefix: classpath:/templates/

server:
  port: 8080
  servlet:
    context-path: /