<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CosmosDomain - Favorites</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:insert="~{fragments/navbar :: navbar}"></header>
<main class="main-content">
    <h1>My Favorites</h1>

    <div th:if="${favorites != null && !favorites.empty}">
        <div class="grid">
            <div th:each="fav : ${favorites}" class="movie-card favorite-card"
                 th:attr="data-type=${fav.mediaType()},data-id=${fav.mediaId()}">
                <a th:href="@{${fav.detailPath()}}">
                    <img th:if="${fav.imageUrl()}" th:src="${fav.imageUrl()}"
                         th:alt="${fav.title()}" class="poster-img">
                    <div th:unless="${fav.imageUrl()}" class="poster-placeholder"
                         th:text="${fav.title()}">Title</div>
                </a>
                <div class="movie-info">
                    <span class="badge" th:text="${fav.typeLabel()}">Movie</span>
                    <h3 th:text="${fav.title()}">Title</h3>
                    <p th:if="${fav.subtitle()}" th:text="${fav.subtitle()}">2024</p>
                    <button type="button" class="btn btn-secondary remove-favorite">Remove</button>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${favorites == null || favorites.empty}">
        <p>No favorites yet. Browse movies, series, or people and add them to your favorites!</p>
        <a th:href="@{/movies}" class="btn btn-primary">Browse Movies</a>
        <a th:href="@{/series}" class="btn btn-secondary">Browse Series</a>
    </div>
</main>

<script>
    document.querySelectorAll('.remove-favorite').forEach(function (button) {
        button.addEventListener('click', async function () {
            const card = button.closest('.favorite-card');
            const params = new URLSearchParams({
                mediaType: card.dataset.type,
                mediaId: card.dataset.id
            });
            const response = await fetch('/favorites/toggle', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: params
            });
            if (!response.ok) return;
            card.remove();
            if (!document.querySelector('.favorite-card')) {
                window.location.reload();
            }
        });
    });
</script>
</body>
</html>
