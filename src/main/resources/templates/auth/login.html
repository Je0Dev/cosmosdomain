<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmosDomain - Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="auth-page">
    <div class="auth-card">
        <h1>CosmosDomain</h1>
        <p class="subtitle">Your universe of film & TV</p>

        <div th:if="${param.error}">
            <p class="error-msg">Invalid username or password.</p>
        </div>

        <div th:if="${param.registered}">
            <p class="success-msg">Registration successful! Please log in.</p>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Log In</button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a th:href="@{/register}">Register here</a>
        </p>
    </div>
</main>
</body>
</html>
