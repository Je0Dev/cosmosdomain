<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CosmosDomain - Error</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="error-page">
    <div class="error-card">
        <h1 th:text="${statusCode ?: 404}">Error</h1>
        <p th:text="${message ?: 'Something went wrong.'}">Error message</p>
        <a th:href="@{/}" class="btn btn-primary">Go Home</a>
    </div>
</main>
</body>
</html>
