<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>CosmosDomain</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:fragment="navbar" class="navbar">
    <a th:href="@{/}" class="brand">CosmosDomain</a>

    <div class="nav-links" sec:authorize="isAuthenticated()">
        <a th:href="@{/movies}">Movies</a>
        <a th:href="@{/series}">Series</a>
        <a th:href="@{/search}">Search</a>
        <a th:href="@{/favorites}">Favorites</a>
        <form th:action="@{/logout}" method="post" class="logout-btn">
            <button type="submit">Logout</button>
        </form>
    </div>

    <div class="nav-links" sec:authorize="isAnonymous()">
        <a th:href="@{/login}">Log In</a>
        <a th:href="@{/register}" class="btn btn-secondary">Sign Up</a>
    </div>
</nav>

</body>
</html>
